# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "corepack pnpm install --frozen-lockfile && corepack pnpm --filter docs build:apidoc"
  start: corepack pnpm --filter docs start --host 0.0.0.0 --port {port}
  url: http://localhost:{port}
  readyPath: /selectbutton
  readyStatus: 200
  runtime: node24
  env:
    NODE_ENV: development
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    NG_CLI_ANALYTICS: "false"
demo:
  maxVideos: 1
  beforePass: true
